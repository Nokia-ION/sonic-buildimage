interface Vlan100
{
    IgnoreIfMissing on;
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 90;
    AdvDefaultLifetime 900;
    AdvReachableTime 30000;
    AdvManagedFlag off;
    AdvOtherConfigFlag off;
    AdvLinkMTU 9100;
    AdvHomeAgentFlag off;
};

interface Vlan200
{
    IgnoreIfMissing on;
    AdvSendAdvert off;
    MinRtrAdvInterval 20;
    MaxRtrAdvInterval 60;
    AdvDefaultLifetime 180;
    AdvManagedFlag off;
    AdvOtherConfigFlag off;
    AdvLinkMTU 9100;
    AdvHomeAgentFlag off;
    prefix 2001:db8:2::/64 {
        AdvOnLink on;
        AdvAutonomous off;
        AdvRouterAddr off;
        AdvValidLifetime infinity;
        AdvPreferredLifetime infinity;
    };
};


